<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="soy 프로필 이미지 자리">
  <!-- 임시 프로필 이미지. 배경은 투명 — 페이지 CSS가 컨테이너 배경을 칠한다.
       다크 모드에서는 CSS filter: invert(1) 로 반전시킨다.
       실제 사진으로 바꿀 때는 이 파일만 교체하면 된다. -->
  <rect x="8" y="8" width="384" height="384" fill="none" stroke="#1A1A1A" stroke-width="1"/>
  <line x1="8" y1="312" x2="392" y2="312" stroke="#1A1A1A" stroke-width="1"/>
  <text x="40" y="230"
        font-family="Arial Black, Helvetica, Arial, sans-serif"
        font-size="150" font-weight="900" letter-spacing="12" fill="#1A1A1A">SOY</text>
  <text x="40" y="352"
        font-family="Helvetica, Arial, sans-serif"
        font-size="20" letter-spacing="6" fill="#8A8A8A">PROFILE / PLACEHOLDER</text>
</svg>
